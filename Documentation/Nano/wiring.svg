<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="Helvetica,Arial,sans-serif" font-size="14">
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold">Morserino-32 Nano – wiring overview</text>

  <!-- Feather -->
  <rect x="300" y="50" width="260" height="470" rx="10" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/>
  <text x="430" y="78" text-anchor="middle" font-weight="bold">Adafruit ESP32-S3 Reverse TFT Feather (#5691)</text>
  <text x="430" y="98" text-anchor="middle" font-size="12" fill="#444">display, 3 buttons, battery gauge: on board</text>

  <!-- pin labels inside Feather -->
  <g font-size="13" fill="#111">
    <text x="312" y="140">D12 (GPIO12)  I2S BCK</text>
    <text x="312" y="170">A4  (GPIO14)  I2S LRCK</text>
    <text x="312" y="200">A2  (GPIO16)  I2S DATA</text>
    <text x="312" y="230">3V3</text>
    <text x="312" y="260">GND</text>
    <text x="312" y="320">D9  (GPIO9)   paddle left / dit</text>
    <text x="312" y="350">D10 (GPIO10)  paddle right / dah</text>
    <text x="312" y="380">GND</text>
    <text x="312" y="420">D5  (GPIO5)   FN button</text>
    <text x="312" y="450">GND</text>
    <text x="312" y="490">D11 (GPIO11)  keyer out (optional)</text>
  </g>

  <!-- PCM5102A -->
  <rect x="20" y="110" width="200" height="170" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="120" y="135" text-anchor="middle" font-weight="bold">PCM5102A DAC board</text>
  <g font-size="13">
    <text x="32" y="160">BCK</text>
    <text x="32" y="180">LCK (LRCK)</text>
    <text x="32" y="200">DIN</text>
    <text x="32" y="220">VIN</text>
    <text x="32" y="240">GND</text>
    <text x="32" y="262">SCK → GND (wire jumper)</text>
  </g>
  <text x="32" y="276" font-size="11" fill="#444">pads H1L–H4L: leave as delivered</text>
  <text x="120" y="300" text-anchor="middle" font-size="12" fill="#444">built-in 3.5 mm headphone jack</text>

  <line x1="220" y1="155" x2="300" y2="135" stroke="#b45309" stroke-width="2"/>
  <line x1="220" y1="175" x2="300" y2="165" stroke="#b45309" stroke-width="2"/>
  <line x1="220" y1="195" x2="300" y2="195" stroke="#b45309" stroke-width="2"/>
  <line x1="220" y1="215" x2="300" y2="225" stroke="#b45309" stroke-width="2"/>
  <line x1="220" y1="235" x2="300" y2="255" stroke="#555" stroke-width="2"/>

  <!-- Paddle jack -->
  <rect x="640" y="290" width="200" height="110" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="740" y="315" text-anchor="middle" font-weight="bold">Key / paddle jack</text>
  <text x="740" y="337" text-anchor="middle" font-size="13">3.5 mm stereo</text>
  <text x="740" y="357" text-anchor="middle" font-size="13">tip → D9, ring → D10</text>
  <text x="740" y="377" text-anchor="middle" font-size="13">sleeve → GND</text>
  <line x1="560" y1="316" x2="640" y2="345" stroke="#15803d" stroke-width="2"/>
  <line x1="560" y1="346" x2="640" y2="355" stroke="#15803d" stroke-width="2"/>
  <line x1="560" y1="376" x2="640" y2="375" stroke="#555" stroke-width="2"/>

  <!-- FN button -->
  <rect x="640" y="415" width="200" height="60" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="740" y="440" text-anchor="middle" font-weight="bold">FN tactile button</text>
  <text x="740" y="460" text-anchor="middle" font-size="13">D5 ↔ GND (active low)</text>
  <line x1="560" y1="416" x2="640" y2="437" stroke="#be185d" stroke-width="2"/>
  <line x1="560" y1="446" x2="640" y2="457" stroke="#555" stroke-width="2"/>

  <!-- Keyer out -->
  <rect x="640" y="486" width="200" height="44" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="740" y="513" text-anchor="middle" font-size="13">optional: TX keying stage</text>
  <line x1="560" y1="486" x2="640" y2="505" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Battery -->
  <rect x="640" y="110" width="200" height="90" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="740" y="138" text-anchor="middle" font-weight="bold">LiPo battery</text>
  <text x="740" y="160" text-anchor="middle" font-size="13">3.7 V 800 mAh, JST-PH</text>
  <text x="740" y="180" text-anchor="middle" font-size="12" fill="#444">slide switch in the + lead</text>
</svg>
